<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Controle | Ipiranga Gestão Imobiliária</title>
<style>
  :root{
    --preto:#0d0d0d; --preto2:#161616; --card:#1c1c1c;
    --laranja:#B05A28; --laranja2:#c96a30; --branco:#f5f5f5;
    --cinza:#9a9a9a; --amarelo:#e8b53a; --vermelho:#d13a3a;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--preto);color:var(--branco);min-height:100vh;padding:24px}
  .wrap{max-width:920px;margin:0 auto}
  header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px}
  .logo{height:64px;width:auto;display:block;margin-bottom:22px}
  h1{font-size:26px;font-weight:700}
  h1 span{color:var(--laranja)}
  .sub{color:var(--cinza);font-size:13.5px;margin-top:8px;text-align:center}

  /* Login */
  #login{max-width:380px;margin:12vh auto;background:var(--card);padding:32px;border-radius:14px;border:1px solid #2a2a2a;text-align:center}
  #login h2{font-size:18px;margin-bottom:6px}
  #login p{color:var(--cinza);font-size:13px;margin-bottom:20px}
  input[type=password]{width:100%;padding:13px 14px;background:var(--preto2);border:1px solid #333;border-radius:8px;color:#fff;font-size:15px;margin-bottom:12px}
  input[type=password]:focus{outline:none;border-color:var(--laranja)}
  .btn{background:var(--laranja);color:#fff;border:none;padding:13px 18px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:.15s}
  .btn:hover{background:var(--laranja2)}
  .erro{color:var(--vermelho);font-size:13px;margin-top:10px;min-height:16px}

  /* Painel */
  #painel{display:none}
  .linkbar{background:var(--card);border:1px solid #2a2a2a;border-radius:10px;padding:14px 16px;margin-bottom:22px;font-size:13px;color:var(--cinza);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .linkbar b{color:var(--branco)}
  .linkbar button{background:var(--preto2);border:1px solid #333;color:#fff;padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13px}
  .linkbar button:hover{border-color:var(--laranja)}

  .corretor{background:var(--card);border:1px solid #2a2a2a;border-radius:12px;padding:18px 20px;margin-bottom:14px}
  .topo{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .nome{font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px}
  .cards{display:flex;gap:6px}
  .ic{font-size:22px;line-height:1}
  .controles{display:flex;gap:8px;flex-wrap:wrap}
  .ctrl{display:flex;align-items:center;gap:7px;background:var(--preto2);border:1px solid #333;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;user-select:none;transition:.15s}
  .ctrl:hover{border-color:var(--laranja)}
  .ctrl input{width:17px;height:17px;cursor:pointer;accent-color:var(--laranja)}
  .ctrl.amar input{accent-color:var(--amarelo)}
  .ctrl.verm input{accent-color:var(--vermelho)}
  .ctrl.susp input{accent-color:var(--vermelho)}
  .msg{margin-top:12px;font-size:13.5px;padding:10px 14px;border-radius:8px;line-height:1.4}
  .msg.amar{background:rgba(232,181,58,.12);color:var(--amarelo);border:1px solid rgba(232,181,58,.3)}
  .msg.verm{background:rgba(209,58,58,.12);color:#ff7373;border:1px solid rgba(209,58,58,.3)}
  .msg.susp{background:var(--vermelho);color:#fff;border:1px solid var(--vermelho);font-weight:600}
  .limpar{background:none;border:1px solid #333;color:var(--cinza);padding:7px 12px;border-radius:7px;font-size:12px;cursor:pointer;margin-top:12px}
  .limpar:hover{border-color:var(--vermelho);color:#ff7373}
  .load{text-align:center;color:var(--cinza);padding:40px;font-size:14px}
  .saved{position:fixed;bottom:20px;right:20px;background:var(--laranja);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
  .saved.show{opacity:1}
</style>
</head>

<script>

  var SENHA = '';

  function entrar(){
    var s = document.getElementById('senha').value;
    if(s === '#Ipiranga7'){
      SENHA = s;
      document.getElementById('login').style.display='none';
      document.getElementById('painel').style.display='block';
      atualizar();

  }

  function atualizar(){
    fetch(API).then(r=>r.json()).then(render).catch(function(){

      if(c.vermelho) cards += '<span class="ic" title="Cartão vermelho">🟥</span>';

      var msg = '';
      if(c.suspenso){
        msg = '<div class="msg susp">🚫 Você está suspenso por 7 dias de receber leads.</div>';
      } else if(c.penalidadeAtiva){
        msg = '<div class="msg verm">⛔ Você ficará dois dias úteis sem receber leads.</div>';
      } else if(c.vermelho){
        msg = '<div class="msg verm">🟥 Cartão vermelho ativo. Cuidado: outro vermelho nesta semana gera suspensão de 7 dias.</div>';
      } else if(c.amarelo){
        msg = '<div class="msg amar">⚠️ Atenção, você está quase perdendo oportunidades de vendas. Atualize o CRM ou o próximo cartão será vermelho.</div>';
      }

      html +=
      '<div class="corretor">'+
        '<div class="topo">'+
          '<div class="nome">'+c.nome+'<span class="cards">'+cards+'</span></div>'+
          '<div class="controles">'+
            ctrl('amar','amarelo',c.nome,c.amarelo,'🟨 Amarelo')+
            ctrl('verm','vermelho',c.nome,c.vermelho,'🟥 Vermelho')+
            ctrl('susp','suspenso',c.nome,c.suspenso,'🚫 Suspensão')+
          '</div>'+
        '</div>'+
        msg+
        '<button class="limpar" onclick="acao(\''+c.nome+'\',\'limpar\')">Zerar penalidades deste corretor</button>'+
      '</div>';
    });
    document.getElementById('lista').innerHTML = html;
  }

  function ctrl(cls, acaoNome, nome, marcado, label){
    var chk = marcado ? 'checked' : '';
    return '<label class="ctrl '+cls+'">'+
      '<input type="checkbox" '+chk+' onchange="if(this.checked)acao(\''+nome+'\',\''+acaoNome+'\')"> '+label+
    '</label>';
  }

  function acao(nome, acao){
    var body = JSON.stringify({senha:SENHA, nome:nome, acao:acao});
    fetch(API, {method:'POST', body:body})
      .then(r=>r.json())
      .then(function(res){
        if(res.ok){ toast(); render(res.state); }
        else alert('Erro: '+(res.error||'desconhecido'));
      });
  }

  function toast(){
    var t=document.getElementById('saved');
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')},1500);
  }
</script>
</body>
</html>
