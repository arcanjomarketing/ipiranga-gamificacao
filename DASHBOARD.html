<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking dos Corretores | Ipiranga Gestão Imobiliária</title>
<style>
  :root{
    --preto:#0d0d0d; --preto2:#161616; --card:#1c1c1c;
    --laranja:#B05A28; --laranja2:#c96a30; --branco:#f5f5f5;
    --cinza:#9a9a9a; --amarelo:#e8b53a; --vermelho:#d13a3a; --verde:#43c463;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--preto);color:var(--branco);min-height:100vh;padding:24px}
  .wrap{max-width:760px;margin:0 auto}
  header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px}
  .logo{height:64px;width:auto;display:block;margin-bottom:22px}
  h1{font-size:26px;font-weight:700}
  h1 span{color:var(--laranja)}
  .sub{color:var(--cinza);font-size:13.5px;margin-top:8px;text-align:center}

  .legenda{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:20px;font-size:12.5px;color:var(--cinza)}
  .legenda span{display:flex;align-items:center;gap:6px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid #2a2a2a;border-radius:12px;padding:15px 18px;margin-bottom:11px;transition:.15s}
  .row.limpo{border-left:4px solid var(--verde)}
  .row.amar{border-left:4px solid var(--amarelo)}
  .row.verm{border-left:4px solid var(--vermelho)}
  .row.susp{border-left:4px solid var(--vermelho);background:rgba(209,58,58,.08)}
  .pos{font-size:20px;font-weight:800;color:var(--laranja);width:34px;text-align:center;flex-shrink:0}
  .info{flex:1;min-width:0}
  .nome{font-size:16px;font-weight:600}
  .status{font-size:12.5px;color:var(--cinza);margin-top:3px}
  .status.ok{color:var(--verde)}
  .status.al{color:var(--amarelo)}
  .status.vm{color:#ff7373}
  .status.sp{color:#ff7373;font-weight:600}
  .cards{font-size:20px;display:flex;gap:4px;flex-shrink:0}

  .foot{text-align:center;color:#555;font-size:12px;margin-top:24px}
  .load{text-align:center;color:var(--cinza);padding:40px}

  footer{margin-top:44px;padding-top:22px;border-top:1px solid #262626;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  footer .flogo{height:40px;width:auto;opacity:.7}
  footer .fdev{color:#6d6d6d;font-size:12px;letter-spacing:.3px}
  footer .fbtn{display:inline-block;margin-top:2px;padding:6px 15px;font-size:12px;color:var(--laranja);border:1px solid var(--laranja);border-radius:20px;text-decoration:none;transition:.15s}
  footer .fbtn:hover{background:var(--laranja);color:#fff}
</style>
</head>

<script>
  // ⚙️ COLE AQUI a mesma URL /exec do Apps Script:
  var API = 'https://script.google.com/macros/s/AKfycbwuglMX8THwLPjl9u9EUTd781vxhERiAgC2xnveMfGzIfiUd3IIDBwa0y9TzJFpKNwvBA/exec';

  function carregar(){
    fetch(API).then(r=>r.json()).then(render).catch(function(){
      document.getElementById('lista').innerHTML='<div class="load">Não foi possível carregar.</div>';
    });
  }

  function pontos(c){
    // Ranking: quem está limpo fica no topo. Penaliza cartões.
    var p = 100;
    if(c.amarelo)  p -= 20;
    if(c.vermelho) p -= 40;
    if(c.suspenso) p -= 100;
    return p;
  }

  function render(state){
    var arr = state.corretores.slice().sort(function(a,b){ return pontos(b)-pontos(a); });
    var html='';
    arr.forEach(function(c,i){
      var cls='limpo', st='<span class="status ok">✔ Em dia — recebendo leads normalmente</span>', cards='✅';
      if(c.suspenso){
        cls='susp'; cards='🚫'; st='<span class="status sp">Suspenso por 7 dias — sem receber leads</span>';
      } else if(c.vermelho){
        cls='verm'; cards=(c.amarelo?'🟨':'')+'🟥';
        st = c.penalidadeAtiva
          ? '<span class="status vm">Cartão vermelho — 2 dias úteis sem leads</span>'
          : '<span class="status vm">Cartão vermelho ativo — atenção redobrada</span>';
      } else if(c.amarelo){
        cls='amar'; cards='🟨'; st='<span class="status al">Cartão amarelo — atualize o CRM</span>';
      }
      html +=
      '<div class="row '+cls+'">'+
        '<div class="pos">'+(i+1)+'º</div>'+
        '<div class="info"><div class="nome">'+c.nome+'</div>'+st+'</div>'+
        '<div class="cards">'+cards+'</div>'+
      '</div>';
    });
    document.getElementById('lista').innerHTML=html;
    var d = new Date(state.atualizado);
    document.getElementById('foot').textContent='Atualizado em '+d.toLocaleString('pt-BR');
  }

  carregar();
  setInterval(carregar, 60000); // atualiza sozinho a cada 1 min
</script>
